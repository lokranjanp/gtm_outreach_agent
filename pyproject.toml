[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signalcraft-outreach"
version = "0.1.0"
description = "Evidence-led B2B outreach drafting with LangGraph, MCP and Streamlit"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.66,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=1.0,<2",
  "langchain-google-genai>=4,<5",
  "langchain-mcp-adapters>=0.2,<0.4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["outreach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
